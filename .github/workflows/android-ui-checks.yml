name: Android UI checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (including pinned FCL source)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android platform, NDK and CMake
        run: sdkmanager "platforms;android-35" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"
      - name: Verify filtered ARM64 Java runtime assets
        run: gradle :fcl-android:verifyFclArm64JreAssets
      - name: Inspect all four ARM64 runtime archives
        run: python3 scripts/verify-fcl-arm64-runtime-archives.py fcl-android/build/generated/fclArm64JreAssets
      - name: Compile FCL Android engine sources
        run: gradle :fcl-android:compileDebugKotlin
      - name: Compile Android Kotlin sources
        run: gradle :app:compileDebugKotlin
      - name: Compile FCL ARM64 native backend
        run: gradle :fcl-native:externalNativeBuildDebug
      - name: Verify FCL native libraries
        run: |
          find fcl-native/build -type f -name '*.so' -print
          test -n "$(find fcl-native/build -type f -name 'libpojavexec.so' -print -quit)"
          test -n "$(find fcl-native/build -type f -name 'libfcl.so' -print -quit)"
      - name: Run FCL runtime layout and app unit tests
        run: gradle :fcl-android:testDebugUnitTest :app:testDebugUnitTest

  horizon-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Check Rust formatting
        working-directory: horizon-android
        run: cargo fmt --all -- --check
      - name: Run Rust unit tests
        working-directory: horizon-android
        run: cargo test
      - name: Build Android ARM64 JNI library
        run: bash scripts/build-horizon-android.sh
      - name: Verify native library output
        run: test -s app/src/main/jniLibs/arm64-v8a/libhorizon_android.so
